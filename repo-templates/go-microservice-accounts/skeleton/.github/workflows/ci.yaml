name: CI
on:
  push:
    branches: ["${{ github.event.repository.default_branch }}"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: echo "built by ${{ github.actor }}"
