# The whole service on your laptop: `make up`, then
#
#   make smoke URL=http://localhost:8000
#
# runs the same check a deploy runs. Stop it with `make down`.
#
# What differs from AWS, and why:
#
#   - Kafka is one plain-text broker instead of MSK with IAM sign-in.
#     message-service runs without the `aws` Spring profile here, so it connects
#     with no credentials.
#   - `proxy` stands in for the load balancer: /api/* goes to message-service
#     and everything else to the frontend. Without it the smoke check, which reaches
#     both through one URL, could not run against your laptop.
#   - The frontend reaches message-service directly on the compose network. In AWS
#     it goes through the load balancer, because ECS tasks there have no names
#     of their own to call.
name: ${{ .Inputs.serviceName }}

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      # One node that is both the broker and its own KRaft controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is what the other containers use; HOST is published on
      # localhost:9094 so a Kafka client on your laptop can read the topic too.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # A single broker cannot hold more than one copy of anything.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # No volume: the topic and its messages go when the container does,
      # so `make down` then `make up` starts from nothing.
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  message-service:
    build:
      context: ./message-service
      args:
        RELEASE: ${RELEASE:-local}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        RELEASE: ${RELEASE:-local}
    environment:
      MESSAGE_SERVICE_URL: http://message-service:8080
    ports:
      - "3000:3000"
    depends_on:
      - message-service

  proxy:
    image: nginx:1.30-alpine
    configs:
      - source: proxy
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "8000:8000"
    depends_on:
      - message-service
      - frontend

configs:
  proxy:
    content: |
      server {
        listen 8000;
        location /api/ {
          proxy_pass http://message-service:8080;
        }
        location / {
          proxy_pass http://frontend:3000;
        }
      }
