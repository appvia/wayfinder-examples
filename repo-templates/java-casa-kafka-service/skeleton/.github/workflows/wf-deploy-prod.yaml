# Deploys a tagged release to production.
#
# Every job checks out the tag rather than the branch head, so the tests, the
# images and the Wayfinder.yaml that is deployed all come from the tagged tree.
# RELEASE is the tag itself, so the images production runs carry the tag as
# their name and /api/healthz reports it.
#
# There are two independent gates:
#
#   1. `environment: production` — GitHub's own gate. Configure reviewers and
#      wait timers on the environment. It also scopes the OIDC token to
#      `repo:<owner>/<repo>:environment:production`, which is what the
#      production service account trusts, so a job that skipped the reviewers
#      would be refused a token, not merely warned about in the UI.
#
#   2. `--require-approval` — Wayfinder's gate on the infrastructure plan. Each
#      CloudResource is planned and pauses for approval. Opt in by setting the
#      WF_PROD_REQUIRE_APPROVAL variable to `true`.
#
# Production can deploy through a different cloud account or region from the
# rest: set WF_IDENTITY or WF_REGION on the production environment and that
# value wins over the repository-wide one.
#
# The images are built by the stack's `pushimages` component rather than here —
# see the note at the top of ci.yaml for why that means this job runs on a plain
# ubuntu runner and not in a container.
#
# This file is copied into your repository verbatim — Wayfinder does not
# template it. The deploy job reads the WAYFINDER_* variables Wayfinder set on
# the production environment when it created this repository.
name: Deploy to production

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

# Serialised, never cancelled: a cancelled `wf deploy` can leave a half-applied
# stack and orphaned cloud resources.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      # message-service compiles for Java 25. The runner ships older JDKs and
      # defaults to one of them; this puts 25 first and caches the Maven
      # repository.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: message-service/pom.xml

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  deploy:
    name: Deploy
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    env:
      WAYFINDER_SERVER: ${{ vars.WAYFINDER_SERVER }}
      WAYFINDER_SERVICE_ACCOUNT: ${{ vars.WAYFINDER_SERVICE_ACCOUNT }}
      WAYFINDER_ENVIRONMENT: ${{ vars.WAYFINDER_ENVIRONMENT }}
      WF_REGION: ${{ vars.WF_REGION }}
      WF_IDENTITY: ${{ vars.WF_IDENTITY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install the Wayfinder CLI
        run: bash .wayfinder/install-wf.sh

      - name: Verify the Wayfinder identity
        run: wf whoami

      # Stops a misconfigured WAYFINDER_SERVER sending a production deploy to
      # the wrong Wayfinder installation. Set WF_EXPECT_INSTANCE_ID to the value
      # of `wf serverinfo -o json | jq -r .instanceIdentifier` for production.
      - name: Verify the Wayfinder installation
        if: vars.WF_EXPECT_INSTANCE_ID != ''
        env:
          EXPECTED: ${{ vars.WF_EXPECT_INSTANCE_ID }}
        run: |
          set -euo pipefail
          actual="$(wf serverinfo -o json | jq -r .instanceIdentifier)"
          if [[ "${actual}" != "${EXPECTED}" ]]; then
            echo "::error::Expected Wayfinder installation '${EXPECTED}' but this is '${actual}'. Nothing was deployed."
            exit 1
          fi

      - name: Deploy the release
        env:
          RELEASE: ${{ github.ref_name }}
          REQUIRE_APPROVAL: ${{ vars.WF_PROD_REQUIRE_APPROVAL }}
          APPROVAL_TIMEOUT: ${{ vars.WF_PROD_APPROVAL_TIMEOUT }}
        run: |
          set -euo pipefail
          source .wayfinder/ci.env

          # The cloud identity sits in the same workspace as the service
          # account, which is the middle segment of tenant:workspace:name.
          workspace="$(cut -d: -f2 <<<"${WAYFINDER_SERVICE_ACCOUNT}")"
          args=(
            --identity "${WF_IDENTITY:-${workspace}/${WAYFINDER_ENVIRONMENT}/aws-${WAYFINDER_ENVIRONMENT}}"
            --region "${WF_REGION}"
          )

          if [[ "${REQUIRE_APPROVAL:-false}" == "true" ]]; then
            args+=("--require-approval")
            if [[ -n "${APPROVAL_TIMEOUT:-}" ]]; then
              args+=("--approval-timeout" "${APPROVAL_TIMEOUT}")
            fi
          fi

          # One long-lived instance, redeployed on every tag. The name is
          # passed on to the step that writes the summary.
          instance="${WF_SERVICE_NAME}-prod"
          echo "WF_INSTANCE=${instance}" >> "$GITHUB_ENV"

          # 45m: the CloudFront distribution has taken 26 minutes of a 30 minute
          # deploy in the sibling Lambda templates, and the frontend waits for
          # it; both ECS services then have to reach a steady state before the
          # smoke check can run. The VPC and the Kafka cluster already exist.
          set +e
          wf deploy --non-interactive --timeout 45m \
            -i "${instance}" \
            -e "${WAYFINDER_ENVIRONMENT}" \
            -f Wayfinder.yaml \
            --env-var RELEASE="${RELEASE}" \
            --out-file ./deploy.json \
            "${args[@]}"
          rc=$?
          set -e

          # Exit code 3 means an approval gate was not decided in time. Nothing
          # was applied — this is not a failed deployment, and re-running the
          # job once the plan is approved is the correct next step. Anything
          # else is a real failure.
          if [[ ${rc} -eq 3 ]]; then
            echo "::error title=Awaiting approval::Deployment of ${RELEASE} is paused at a Wayfinder approval gate and the approval window elapsed. Nothing has been applied. Approve the plan with 'wf approve cloudresource', then re-run this job."
            {
              echo "### :hourglass: ${RELEASE} is awaiting approval"
              echo ""
              echo "No changes were applied. Review the plan in this job's log, approve it with"
              echo "\`wf approve cloudresource <name> -w ${workspace} -e ${WAYFINDER_ENVIRONMENT}\`,"
              echo "then re-run this job."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi
          exit ${rc}

      - name: Summarise
        env:
          RELEASE: ${{ github.ref_name }}
        run: |
          host="$(jq -r '.componentOutputs.web.cloudfront_url.value // empty' ./deploy.json)"
          {
            echo "### Released ${RELEASE} to ${WAYFINDER_ENVIRONMENT}"
            echo ""
            echo "- Instance: \`${WF_INSTANCE}\`"
            echo "- Release: \`${RELEASE}\`"
            url="${host:+https://${host}}"
            echo "- URL: ${url:-(none published)}"
          } >> "$GITHUB_STEP_SUMMARY"
