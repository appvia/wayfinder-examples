apiVersion: cloudresources/v3
kind: CloudResourcePlan
metadata:
  name: aws-dynamodb-table
  version: "1.1.0"
spec:
  cloud: aws
  description: "DynamoDB table with pay-per-request billing, optional Streams + TTL, and scoped read/write/stream consumption policies"
  inputs:
    - name: suffix
      description: "Disambiguates multiple tables in one stack. Final table name: ${stack}-${instance}-${suffix}."
      type: string
      optional: false
    - name: hash_key
      description: "Name of the hash (partition) key attribute. Type is always String."
      type: string
      optional: false
    - name: range_key
      description: "Name of the range (sort) key attribute. Type is always String. Leave empty for no range key."
      type: string
      optional: true
      defaultValue: ""
    - name: billing_mode
      description: "DynamoDB billing mode. PAY_PER_REQUEST or PROVISIONED."
      type: string
      optional: true
      defaultValue: PAY_PER_REQUEST
    - name: stream_view_type
      description: "Enable DynamoDB Streams with this view type (NEW_IMAGE, NEW_AND_OLD_IMAGES, OLD_IMAGE, KEYS_ONLY). Empty (default) disables streams."
      type: string
      optional: true
      defaultValue: ""
    - name: ttl_attribute
      description: "Attribute name holding an epoch-seconds expiry for DynamoDB TTL auto-deletion. Empty (default) disables TTL."
      type: string
      optional: true
      defaultValue: ""
  consumptionPolicies:
    - name: read
      grantPermissions:
        aws:
          customIAMPolicyTemplate: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DynamoDBRead",
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:BatchGetItem",
                    "dynamodb:Query",
                    "dynamodb:Scan",
                    "dynamodb:DescribeTable"
                  ],
                  "Resource": [
                    "${{ .Outputs.table_arn }}",
                    "${{ .Outputs.table_arn }}/index/*"
                  ]
                }
              ]
            }
    - name: write
      grantPermissions:
        aws:
          customIAMPolicyTemplate: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DynamoDBWrite",
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:PutItem",
                    "dynamodb:UpdateItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:BatchWriteItem",
                    "dynamodb:DescribeTable"
                  ],
                  "Resource": [
                    "${{ .Outputs.table_arn }}",
                    "${{ .Outputs.table_arn }}/index/*"
                  ]
                }
              ]
            }
    - name: read-write
      grantPermissions:
        aws:
          customIAMPolicyTemplate: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DynamoDBReadWrite",
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:BatchGetItem",
                    "dynamodb:Query",
                    "dynamodb:Scan",
                    "dynamodb:DescribeTable",
                    "dynamodb:PutItem",
                    "dynamodb:UpdateItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:BatchWriteItem"
                  ],
                  "Resource": [
                    "${{ .Outputs.table_arn }}",
                    "${{ .Outputs.table_arn }}/index/*"
                  ]
                }
              ]
            }
    # For a consumer that reads this table's DynamoDB Stream (e.g. a Lambda
    # event-source mapping). Requires stream_view_type to be set on the table.
    - name: stream
      grantPermissions:
        aws:
          customIAMPolicyTemplate: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Sid": "DynamoDBStreamRead",
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetRecords",
                    "dynamodb:GetShardIterator",
                    "dynamodb:DescribeStream"
                  ],
                  "Resource": "${{ .Outputs.table_arn }}/stream/*"
                },
                {
                  "Sid": "DynamoDBListStreams",
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:ListStreams"
                  ],
                  "Resource": "*"
                }
              ]
            }
  terraform:
    files:
      - name: main.tf
        template: |
          resource "aws_dynamodb_table" "this" {
            name         = "${{ .Stack.Name }}-${{ .Stack.Instance.Name }}-${{ .Inputs.suffix }}"
            billing_mode = "${{ .Inputs.billing_mode }}"
            hash_key     = "${{ .Inputs.hash_key }}"

            ${{- if .Inputs.range_key }}
            range_key = "${{ .Inputs.range_key }}"
            ${{- end }}

            attribute {
              name = "${{ .Inputs.hash_key }}"
              type = "S"
            }

            ${{- if .Inputs.range_key }}
            attribute {
              name = "${{ .Inputs.range_key }}"
              type = "S"
            }
            ${{- end }}

            ${{- if .Inputs.stream_view_type }}
            stream_enabled   = true
            stream_view_type = "${{ .Inputs.stream_view_type }}"
            ${{- end }}

            ${{- if .Inputs.ttl_attribute }}
            ttl {
              attribute_name = "${{ .Inputs.ttl_attribute }}"
              enabled        = true
            }
            ${{- end }}

            tags = {
              Application = "${{ .Stack.Name }}"
              Environment = "${{ .Stack.Instance.Name }}"
              ManagedBy   = "Wayfinder"
            }
          }
      - name: outputs.tf
        template: |
          output "table_name" {
            value = aws_dynamodb_table.this.name
          }
          output "table_arn" {
            value = aws_dynamodb_table.this.arn
          }
          # Empty string when streams are disabled (stream_view_type unset).
          output "stream_arn" {
            value = aws_dynamodb_table.this.stream_arn
          }
