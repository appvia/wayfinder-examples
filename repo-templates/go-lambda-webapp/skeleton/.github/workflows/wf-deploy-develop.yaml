# Deploys to the develop environment on every merge to the default branch.
#
# RELEASE carries the commit SHA, which tags the image and is compiled into the
# binary, so /api/healthz on the running function names the commit it came from.
#
# The image is built by the stack's `pushimage` component rather than here — see
# the note at the top of ci.yaml for why that means this job runs on a plain
# ubuntu runner and not in a container.
#
# This file is copied into your repository verbatim — Wayfinder does not
# template it. The deploy job reads the WAYFINDER_* variables Wayfinder set on
# the develop environment when it created this repository.
name: Deploy to develop

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # go.mod asks for a Go the runner does not ship, and GOTOOLCHAIN alone is
      # not enough: it fetches a compiler but not the tools beside it, so
      # `go test -covermode=atomic` stops with `no such tool "covdata"`. This
      # installs the whole toolchain go.mod names.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  deploy:
    name: Deploy
    needs: [test]
    runs-on: ubuntu-latest
    # Scopes the OIDC token to `repo:<owner>/<repo>:environment:develop`, which
    # is what the develop service account trusts, and shows this job the
    # variables set on that environment.
    environment: develop
    env:
      WAYFINDER_SERVER: ${{ vars.WAYFINDER_SERVER }}
      WAYFINDER_SERVICE_ACCOUNT: ${{ vars.WAYFINDER_SERVICE_ACCOUNT }}
      WAYFINDER_ENVIRONMENT: ${{ vars.WAYFINDER_ENVIRONMENT }}
      WF_REGION: ${{ vars.WF_REGION }}
      WF_IDENTITY: ${{ vars.WF_IDENTITY }}
      WF_DNS_ZONE: ${{ vars.WF_DNS_ZONE }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the Wayfinder CLI
        run: bash .wayfinder/install-wf.sh

      - name: Deploy
        run: |
          set -euo pipefail
          source .wayfinder/ci.env

          # The cloud identity sits in the same workspace as the service
          # account, which is the middle segment of tenant:workspace:name.
          workspace="$(cut -d: -f2 <<<"${WAYFINDER_SERVICE_ACCOUNT}")"
          args=(
            --identity "${WF_IDENTITY:-${workspace}/${WAYFINDER_ENVIRONMENT}/aws-${WAYFINDER_ENVIRONMENT}}"
            --region "${WF_REGION}"
          )
          # Without a zone the web app answers on CloudFront's own
          # *.cloudfront.net domain, which needs no Route53 zone.
          if [[ -n "${WF_DNS_ZONE:-}" ]]; then
            args+=(--dns-zone "${WF_DNS_ZONE}")
          fi

          # One long-lived instance, redeployed on every merge. The name is
          # passed on to the step that writes the summary.
          instance="${WF_SERVICE_NAME}-develop"
          echo "WF_INSTANCE=${instance}" >> "$GITHUB_ENV"

          # 45m, not 30m: creating the CloudFront distribution took 25m55s of a
          # 29m50s deploy when this was measured, which left ten seconds in hand.
          wf deploy --non-interactive --timeout 45m \
            -i "${instance}" \
            -e "${WAYFINDER_ENVIRONMENT}" \
            -f Wayfinder.yaml \
            --env-var RELEASE="sha-${GITHUB_SHA:0:7}" \
            --out-file ./deploy.json \
            "${args[@]}"

      - name: Summarise
        run: |
          {
            echo "### Deployed to ${WAYFINDER_ENVIRONMENT}"
            echo ""
            echo "- Instance: \`${WF_INSTANCE}\`"
            echo "- Release: \`sha-${GITHUB_SHA:0:7}\`"
            echo "- URL: https://$(jq -r '.componentOutputs.web.cloudfront_url.value // "(none published)"' ./deploy.json)"
          } >> "$GITHUB_STEP_SUMMARY"
