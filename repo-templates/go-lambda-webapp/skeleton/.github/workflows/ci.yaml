# Pull request checks.
#
# Tests the code, validates the stack against Wayfinder without applying
# anything, then deploys a throwaway preview instance and comments its URL on
# the pull request. The preview is destroyed by wf-preview-teardown.yaml when
# the pull request closes.
#
# There is no image build here. The stack's `pushimage` component builds the
# image and pushes it to this service's own ECR repository, creating that
# repository the first time anything deploys, so there is no registry to log
# into and no registry credential to store. That component runs on this runner,
# which is why the deploy jobs run on a plain ubuntu runner rather than in a
# container: they need docker, make, go and node, which the runner already has.
#
# Every job that talks to Wayfinder declares `environment: preview`. GitHub
# scopes the OIDC token to that environment, and the preview service account
# trusts that token and no other, so a job that dropped the line could not sign
# in at all. Declaring it is also what shows the job the WAYFINDER_* variables
# Wayfinder set on the preview environment when it created this repository.
#
# This file is copied into your repository verbatim — Wayfinder does not
# template it, so you can edit it like any other workflow.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write # lets GitHub mint the OIDC token Wayfinder authenticates with

# Runs for one pull request are serialised rather than cancelled: a cancelled
# `wf deploy` can leave a half-applied stack and orphaned cloud resources.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # go.mod asks for a Go the runner does not ship, and GOTOOLCHAIN alone is
      # not enough: it fetches a compiler but not the tools beside it, so
      # `go test -covermode=atomic` stops with `no such tool "covdata"`. This
      # installs the whole toolchain go.mod names.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Lint
        run: make lint

  validate:
    name: Validate stack
    runs-on: ubuntu-latest
    environment: preview
    env:
      WAYFINDER_SERVER: ${{ vars.WAYFINDER_SERVER }}
      WAYFINDER_SERVICE_ACCOUNT: ${{ vars.WAYFINDER_SERVICE_ACCOUNT }}
      WAYFINDER_ENVIRONMENT: ${{ vars.WAYFINDER_ENVIRONMENT }}
      WF_REGION: ${{ vars.WF_REGION }}
      WF_IDENTITY: ${{ vars.WF_IDENTITY }}
      WF_DNS_ZONE: ${{ vars.WF_DNS_ZONE }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the Wayfinder CLI
        run: bash .wayfinder/install-wf.sh

      # Plans the deployment server-side and applies none of it — no image is
      # built and no LocalAction runs. Note that when Wayfinder.yaml refers to a
      # plan as `file:plans/...`, that plan IS published to the workspace
      # catalogue even on a dry run, so the service account needs catalogue
      # write as well as deploy rights.
      - name: Validate the stack
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source .wayfinder/ci.env

          # The cloud identity sits in the same workspace as the service
          # account, which is the middle segment of tenant:workspace:name.
          workspace="$(cut -d: -f2 <<<"${WAYFINDER_SERVICE_ACCOUNT}")"
          args=(
            --identity "${WF_IDENTITY:-${workspace}/${WAYFINDER_ENVIRONMENT}/aws-${WAYFINDER_ENVIRONMENT}}"
            --region "${WF_REGION}"
          )
          # Without a zone the web app answers on CloudFront's own
          # *.cloudfront.net domain, which needs no Route53 zone.
          if [[ -n "${WF_DNS_ZONE:-}" ]]; then
            args+=(--dns-zone "${WF_DNS_ZONE}")
          fi

          wf deploy --dry-run --non-interactive \
            -i "${WF_SERVICE_NAME}-pr${PR_NUMBER}" \
            -e "${WAYFINDER_ENVIRONMENT}" \
            -f Wayfinder.yaml \
            --env-var RELEASE="pr-${PR_NUMBER}" \
            "${args[@]}"

  preview:
    name: Preview environment
    needs: [test, validate]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    env:
      WAYFINDER_SERVER: ${{ vars.WAYFINDER_SERVER }}
      WAYFINDER_SERVICE_ACCOUNT: ${{ vars.WAYFINDER_SERVICE_ACCOUNT }}
      WAYFINDER_ENVIRONMENT: ${{ vars.WAYFINDER_ENVIRONMENT }}
      WF_REGION: ${{ vars.WF_REGION }}
      WF_IDENTITY: ${{ vars.WF_IDENTITY }}
      WF_DNS_ZONE: ${{ vars.WF_DNS_ZONE }}
    steps:
      - uses: actions/checkout@v6

      - name: Install the Wayfinder CLI
        run: bash .wayfinder/install-wf.sh

      # RELEASE tags the image and is compiled into the binary, so the /api/healthz
      # response of a running preview names the commit it came from.
      - name: Deploy the preview instance
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source .wayfinder/ci.env

          # The cloud identity sits in the same workspace as the service
          # account, which is the middle segment of tenant:workspace:name.
          workspace="$(cut -d: -f2 <<<"${WAYFINDER_SERVICE_ACCOUNT}")"
          args=(
            --identity "${WF_IDENTITY:-${workspace}/${WAYFINDER_ENVIRONMENT}/aws-${WAYFINDER_ENVIRONMENT}}"
            --region "${WF_REGION}"
          )
          if [[ -n "${WF_DNS_ZONE:-}" ]]; then
            args+=(--dns-zone "${WF_DNS_ZONE}")
          fi

          # One instance per pull request, so two open pull requests never
          # deploy over each other. The name is passed on to the comment step.
          instance="${WF_SERVICE_NAME}-pr${PR_NUMBER}"
          echo "WF_INSTANCE=${instance}" >> "$GITHUB_ENV"

          wf deploy --non-interactive --timeout 30m \
            -i "${instance}" \
            -e "${WAYFINDER_ENVIRONMENT}" \
            -f Wayfinder.yaml \
            --env-var RELEASE="pr-${PR_NUMBER}-${GITHUB_SHA:0:7}" \
            --label "preview:pr-${PR_NUMBER}" \
            --out-file ./preview.json \
            "${args[@]}"
          host="$(jq -r '.componentOutputs.web.cloudfront_url.value // empty' ./preview.json)"
          if [[ -n "${host}" ]]; then
            echo "url=https://${host}" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment the preview URL on the pull request
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PREVIEW_INSTANCE: ${{ env.WF_INSTANCE }}
          PREVIEW_ENVIRONMENT: ${{ env.WAYFINDER_ENVIRONMENT }}
        with:
          script: |
            const info = {
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            }
            const marker = '<!-- wayfinder-preview -->'
            const url = process.env.PREVIEW_URL
            const headline = url
              ? `**${url}**`
              : '_Deployed, but the stack published no web address._'
            const body = [
              marker,
              '### Wayfinder preview environment',
              '',
              headline,
              '',
              `<sub>Instance \`${process.env.PREVIEW_INSTANCE}\` in environment ` +
                `\`${process.env.PREVIEW_ENVIRONMENT}\` · commit ${context.sha.substring(0, 7)} · ` +
                'destroyed automatically when this pull request closes.</sub>',
            ].join('\n')

            for (const comment of (await github.rest.issues.listComments(info)).data) {
              if (comment.user.type === 'Bot' && comment.body.includes(marker)) {
                await github.rest.issues.updateComment({ ...info, comment_id: comment.id, body })
                return
              }
            }
            await github.rest.issues.createComment({ ...info, body })
