# One deployer group per environment.
#
# The NAME IS A CONTRACT with the platform's vending workflow: it grants the
# vended identity to `<workspace>-<environment>-deployers`, built from the
# WORKSPACE rather than the team name, so the two must not be conflated here
# even when they hold the same value. Renaming this takes away the team's access
# to its own cloud account with no error at apply time — the grant simply names a
# group that does not exist.
#
# Membership is managed here, by pull request. That is the point of the split:
# the team decides WHO is in the group, and the platform decides what the group
# can reach.
apiVersion: core/v3
kind: Group
metadata:
  name: ${{ .Inputs.workspace }}-${{ .Inputs.firstEnvironment }}-deployers
  workspace: ${{ .Inputs.workspace }}
spec:
  description: May deploy into the ${{ .Inputs.workspace }} ${{ .Inputs.firstEnvironment }} environment
  members: []
