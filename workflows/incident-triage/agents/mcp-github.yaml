# GitHub's hosted MCP server, giving AI agents access to repositories, code
# search, commits and pull requests.
#
# It stores no credential. auth.codeRepoRef makes each call use a short-lived
# token Wayfinder mints for ONE repository — the repository of the conversation
# using the MCP, which the workflow's investigate task sets in
# ai.sourceContext — through the Wayfinder GitHub App installed on your
# organisation. The codeRepo input is left unanswered on purpose: Wayfinder
# fills it from the conversation, and nothing else can. A conversation with no
# repository gets none of this MCP's tools.
#
# A call is refused unless the agent has access in the repository's usableBy
# list — see ../coderepo.yaml, which grants incident-investigator read.
# Prerequisites: the GitHub integration enabled and your organisation connected
# (see ../README.md).
#
# The same repository also backs the create-issue WebAPI (../webapi-github.yaml),
# so the whole example holds no GitHub credential. This MCP covers the agent's
# READ path; writing an issue happens outside the agent, in a workflow task you
# gate.
#
# The /mcp/readonly path serves only the read-only subset of GitHub's MCP
# tools — a belt-and-braces guarantee that agents bound to this MCP cannot
# write to your repositories, on top of the per-agent tool allowlist (see
# spec.mcps in incident-investigator.yaml) and the read-only access level below.
apiVersion: integrations/v3
kind: MCP
metadata:
  name: github
spec:
  integrationRef: incident-tools
  vendor: GitHub
  description: GitHub repositories, code search, commits and pull requests (read-only).
  enabled: true
  inputs:
    - name: codeRepo
      type: string
      optional: true
      refType:
        kind: CodeRepo
      description: The repository the MCP works on. Each conversation sets it to its own repository.
  connection:
    baseURL: https://api.githubcopilot.com
    auth:
      codeRepoRef: '${{ .Inputs.codeRepo }}'
      # The most a call may do in the repository. "read" is the default; it is
      # spelled out because this MCP must never write.
      access: read
  path: /mcp/readonly
