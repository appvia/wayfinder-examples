# SigNoz Cloud's hosted MCP server, giving AI agents query access to your
# metrics, logs, traces and alerts.
#
# Replace the region in the base URL with your SigNoz Cloud region (us, eu, in —
# shown under Settings → Ingestion in SigNoz). Self-hosted SigNoz also serves
# MCP; point the base URL at your instance instead. Either way, keep the host in
# step with spec.service in externalidentity-signoz-mcp.yaml: Wayfinder only
# presents a credential to the host it was created for.
#
# An MCP is installed at the tenant; a workspace's agents reach it through that
# workspace's MCPConnection (mcpconnection-signoz.yaml). Which tools each agent
# may call is curated on the agent side — see spec.mcps in
# incident-investigator.yaml.
apiVersion: integrations/v3.1
kind: MCP
metadata:
  name: signoz
spec:
  integrationRef: incident-tools
  vendor: SigNoz
  description: SigNoz Cloud observability — metrics, logs, traces, alerts and dashboards.
  enabled: true
  connection:
    baseURL: https://mcp.eu.signoz.cloud
    auth:
      identity:
        # An APIKey ExternalIdentity: Wayfinder sends each of its headers on
        # every request, and never returns the values through the API.
        types: [APIKey]
        # The tenant's own credential for the server, which a workspace's
        # connection may choose (useTenantDefault) instead of supplying its own.
        # Whoever saves this MCP must be able to use the identity, and shares it
        # with every workspace that connects the MCP that way.
        default:
          identity: signoz-mcp
  path: /mcp
