# Outbound connection to the GitHub REST API, so the incident-triage workflow can
# open an issue when the agent judges an incident serious enough to need one.
#
# It authenticates through the Wayfinder GitHub App installed on your
# organisation, the same way the agent's read-only MCP does, so this example
# stores no GitHub credential at all — nothing to mint, hold or rotate. Each
# invocation names its repository in the codeRepo input, and Wayfinder mints a
# short-lived token for that repository alone and sends it as a bearer token.
#
# The access level comes from the operation's method: POST needs write. The call
# is refused unless whoever it is made for holds that access in the repository's
# usableBy list — from a workflow task that is the Workflow itself, which
# ../coderepo.yaml grants write. A `wf invoke webapi` by hand is checked against
# you instead.
#
# A WebAPI is a reusable connection plus a set of templated operations. The
# workflow reaches an operation by the action path
# "<integration>/webapi/<webapi>/<operation>" — here
# "incident-tools/webapi/github/create-issue". Each call records a
# WebAPIInvocation, whose response body the workflow reads as
# `.Tasks.<task>.output.*` — which is how the Slack task below gets the new
# issue's html_url without any extra configuration.
#
# Note the body templating: values are injected with `| toJson`, NOT wrapped in
# quotes. The issue body is agent-authored markdown containing real newlines and
# quote characters, and toJson emits a correctly-escaped JSON string. Writing
# "${{ .Inputs.body }}" instead would produce invalid JSON the moment the agent
# used a second line.
apiVersion: integrations/v3
kind: WebAPI
metadata:
  name: github
spec:
  integrationRef: incident-tools
  description: GitHub REST API — open an issue for an incident that needs human attention.
  enabled: true

  connection:
    baseURL: https://api.github.com
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    auth:
      # No stored credential: the token is minted per invocation for the
      # repository the operation's codeRepo input names, and Wayfinder sets the
      # Authorization header from it (redacted in the invocation record).
      codeRepoRef: '${{ .Inputs.codeRepo }}'

  operations:
    - name: create-issue
      summary: Open an issue in a repository
      method: POST
      path: /repos/${{ .Inputs.owner }}/${{ .Inputs.repo }}/issues
      inputs:
        - name: codeRepo
          description: The repository to open the issue in, as github.com/OWNER/REPO. The token is minted for this repository only, so it must be the same one owner and repo name.
          type: string
          refType:
            kind: CodeRepo
        - name: owner
          description: Repository owner (organisation or user)
          type: string
        - name: repo
          description: Repository name
          type: string
        - name: title
          description: Issue title
          type: string
        - name: body
          description: Issue body (markdown)
          type: string
          optional: true
        - name: labels
          description: Comma-separated issue labels
          type: string
          optional: true
      body: |
        {
          "title": ${{ .Inputs.title | toJson }},
          "body": ${{ .Inputs.body | default "" | toJson }},
          "labels": ${{ .Inputs.labels | default "" | splitList "," | compact | toJson }}
        }
      response:
        successCondition: ".statusCode == 201"
