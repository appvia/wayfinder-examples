# The Slack bot token the chat.postMessage WebAPI authenticates with.
#
# Create the Slack app from slack-app-manifest.yaml, install it, and paste the
# Bot User OAuth Token (starts "xoxb-") below. See "Setting up Slack" in
# README.md for the full walkthrough, including which channel identifier to use
# and how to test the token before running the workflow.
#
# purpose: Integration is required for a secret used by a WebAPI.
apiVersion: org/v3
kind: PlatformSecret
metadata:
  name: slack-token
spec:
  description: Slack bot token for posting critical-incident notifications
  purpose: Integration
  type: Generic
  fields:
    token: "REPLACE-WITH-YOUR-SLACK-BOT-TOKEN"
