# The permissions the investigation runs with.
#
# A workflow-triggered run has no interactive user to borrow permissions from.
# An ai/agent task's conversation runs as the agent itself — an AIAgent is a
# first-class subject — so the roles bound to the agent are exactly what its
# Wayfinder tools may do. Grant nothing and every Wayfinder tool the agent calls
# is refused.
#
# Read-only on purpose. The agent observes and reports; the only things that write
# anything are the GitHub and Slack tasks, which act with their own credentials
# under a condition you authored. metadata.workspace places the binding, so this
# grants "viewer" in my-team and nowhere else — widen it with further bindings if
# an investigation needs to see other workspaces.
#
# The binding names the agent it grants to, and Wayfinder checks it exists;
# `wf apply -f` on the whole directory applies the agent first.
#
# Wayfinder checks that whoever authors the Workflow holds a superset of the
# permissions of every identity its tasks run as — here, this agent — so a run can
# never exceed the person who set it up.
apiVersion: org/v3
kind: RoleBinding
metadata:
  name: incident-investigator-viewer
  workspace: my-team
spec:
  roles:
    - viewer
  subject:
    kind: AIAgent
    name: incident-investigator
