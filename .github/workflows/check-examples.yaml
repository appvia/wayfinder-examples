# Server dry run of the examples (ci/check.sh) against the production Wayfinder, as the service
# account in ci/service-account.yaml. Nothing is created.
#
# Repository variables: WAYFINDER_SERVER (https://on.wayfinder.run), WAYFINDER_TENANT (appvia)
# and WF_TOOLBOX_IMAGE (the released wftoolbox image).
name: Check examples against Wayfinder

on:
  # Pull requests only: the service account trusts pull-request tokens and nothing else.
  pull_request:
    paths: ["quickstart/**", "workflows/**", "ci/**", ".github/workflows/check-examples.yaml"]

permissions:
  contents: read
  id-token: write # lets GitHub mint the OIDC token Wayfinder authenticates with

concurrency:
  group: check-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Dry run against production
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.WF_TOOLBOX_IMAGE }}
    env:
      WAYFINDER_SERVER: ${{ vars.WAYFINDER_SERVER }}
      WAYFINDER_TENANT: ${{ vars.WAYFINDER_TENANT }}
      # tenant:workspace:name
      WAYFINDER_SERVICE_ACCOUNT: ${{ vars.WAYFINDER_TENANT }}:wfci:github-wayfinder-examples-check
    steps:
      - uses: actions/checkout@v6
      - name: Dry run
        run: bash ci/check.sh
