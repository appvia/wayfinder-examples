apiVersion: cloudresources/v3
kind: CloudResourcePlan
metadata:
  name: azure-storage-data
  version: "1.0.0"
spec:
  cloud: azure
  description: "Azure Storage Account + blob container for application data, with read-only / read-write consumption policies (Azure RBAC role assignments) that other components can be granted."
  scope:
    allWorkspaces: true
  inputs:
    - name: container_name
      description: "Name of the blob container to create and expose."
      type: string
      optional: true
      defaultValue: "data"
    - name: suffix
      description: "Differentiates resources within a stack instance."
      type: string
      optional: true
      defaultValue: "data"

  # This is a PROVIDER plan: it has no workload identity of its own. Instead it
  # publishes consumption policies that other components can be granted from the
  # manifest. Wayfinder turns a grant into the Azure role assignment below and
  # applies it to the consumer's managed identity — no role assignment written by
  # hand. Scope is the storage account, so the grant covers every container in it.
  #
  # Azure has no built-in *write-only* blob data role, so unlike the AWS example
  # this plan exposes read-only and read-write only.
  consumptionPolicies:
    - name: read-only
      grantPermissions:
        azure:
          roleAssignmentsTemplate: |
            - roleDefinitionName: Storage Blob Data Reader
              scope: ${{ .Outputs.storage_account_id }}
    - name: read-write
      grantPermissions:
        azure:
          roleAssignmentsTemplate: |
            - roleDefinitionName: Storage Blob Data Contributor
              scope: ${{ .Outputs.storage_account_id }}

  terraform:
    files:
      - name: main.tf
        template: |
          # A resource group shared by this stack instance. The function component
          # reuses it (its managed identity is created here too), so the name is
          # derived deterministically from the stack + instance.
          resource "azurerm_resource_group" "this" {
            name     = "${{ .Stack.Name }}-${{ .Stack.Instance.Name }}-rg"
            location = "${{ .Cloud.Region }}"

            tags = {
              Application = "${{ .Stack.Name }}"
              Environment = "${{ .Stack.Instance.Name }}"
              ManagedBy   = "Wayfinder"
            }
          }

          # Storage account names are globally unique, 3-24 chars, lowercase
          # alphanumeric only. Derive a stable prefix from the stack + instance and
          # append a short random suffix so repeated deploys across tenants don't
          # collide.
          resource "random_id" "sa" {
            byte_length = 3
          }

          locals {
            sa_prefix = substr(lower(replace("${{ .Stack.Name }}${{ .Stack.Instance.Name }}${{ .Inputs.suffix }}", "/[^a-z0-9]/", "")), 0, 18)
            sa_name   = "${local.sa_prefix}${random_id.sa.hex}"
          }

          resource "azurerm_storage_account" "this" {
            name                     = local.sa_name
            resource_group_name      = azurerm_resource_group.this.name
            location                 = azurerm_resource_group.this.location
            account_tier             = "Standard"
            account_replication_type = "LRS"
            min_tls_version          = "TLS1_2"

            # The function reaches blobs with its managed identity (Entra), never a
            # shared key — that is the whole point of the grant. We leave shared-key
            # access at its default (enabled) only because the provider creates the
            # container over the data plane with a key; for a hardened setup, disable
            # it and create the container over the control plane.

            tags = {
              Application = "${{ .Stack.Name }}"
              Environment = "${{ .Stack.Instance.Name }}"
              ManagedBy   = "Wayfinder"
            }
          }

          resource "azurerm_storage_container" "this" {
            name                  = "${{ .Inputs.container_name }}"
            storage_account_id    = azurerm_storage_account.this.id
            container_access_type = "private"
          }
      - name: outputs.tf
        template: |
          output "storage_account_id" {
            value = azurerm_storage_account.this.id
          }
          output "storage_account_name" {
            value = azurerm_storage_account.this.name
          }
          output "container_name" {
            value = azurerm_storage_container.this.name
          }
          output "resource_group_name" {
            value = azurerm_resource_group.this.name
          }
