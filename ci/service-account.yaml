# The service account this repository's pull requests run as on the production Wayfinder
# (tenant appvia), for the server dry run in ci/check.sh. Nothing is ever applied with it.
#
# It holds workspace.cataloguemanagement in the wfci workspace and nothing else: ci/check.sh
# checks the plans as plans in wfci. A server dry run is checked as a create, so a read-only role
# is refused, and this is the narrowest role that creates plans. The job only ever passes
# --dry-run server, but anyone who can push a branch here can change what the pull-request job
# runs, so keep this role as narrow as the check allows.
#
# The subject uses GitHub's immutable IDs (organisation 33072293, repository 684232753), so a
# recreated repository of the same name cannot use it. Pull requests from forks get no OIDC token,
# so cannot use it either.
#
# Applied by hand, because CI cannot grant itself roles:
#
#   wf --profile prod --tenant appvia apply -f ci/service-account.yaml
apiVersion: org/v3
kind: ServiceAccount
metadata:
  name: github-wayfinder-examples-check
  workspace: wfci
spec:
  description: Dry-runs appvia/wayfinder-examples pull requests against production
---
apiVersion: org/v3
kind: ServiceAccountCredential
metadata:
  name: github-wayfinder-examples-check:gh-pull-requests
  workspace: wfci
spec:
  method: Federated
  serviceAccount: github-wayfinder-examples-check
  federated:
    issuer: https://token.actions.githubusercontent.com
    subject: repo:appvia@33072293/wayfinder-examples@684232753:pull_request
    audiences:
      - https://on.wayfinder.run/t/appvia
---
apiVersion: org/v3
kind: RoleBinding
metadata:
  name: ServiceAccount:wfci:github-wayfinder-examples-check
  workspace: wfci
spec:
  roles:
    - workspace.cataloguemanagement
  subject:
    kind: ServiceAccount
    name: github-wayfinder-examples-check
    workspace: wfci
